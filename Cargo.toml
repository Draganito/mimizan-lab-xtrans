# The command line is the package at the root, and what `cargo build`,
# `cargo test` and `cargo deb` mean without more words. The window is the
# second member: `cargo build --release -p mimizan-lab-xtrans-gui`.
[workspace]
members = [".", "gui"]

[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
authors = ["Dragan Bojovic"]

[package]
name = "mimizan-lab-xtrans"
description = "Fuji X-Trans RAF to linear DNG: luminance and colour separated by their carriers, not interpolated"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "xtrans2dng"
path = "src/main.rs"

[dependencies]
rawler = "0.8"
rayon = "1.12"
rustfft = "6"
clap = { version = "4.6", features = ["derive"] }

# `cargo deb --profile dist` builds the Debian package
# (.github/workflows/packages.yml). The Windows and the macOS archive are
# made by dist/make_windows_zip.ps1 and dist/make_macos_zip.sh.
[package.metadata.deb]
maintainer = "Dragan Bojovic"
copyright = "2026, Dragan Bojovic"
license-file = ["LICENSE", "0"]
section = "graphics"
priority = "optional"
depends = "$auto"
# The window is the workspace's second package, and the two names in
# usr/bin are the starter from launch/. Both are built before `cargo deb`
# runs. The programs themselves are the two files under usr/lib: an older
# CPU never reaches them.
assets = [
    ["target/launch/release/xtrans-launch", "usr/bin/xtrans2dng", "755"],
    ["target/launch/release/xtrans-launch-gui", "usr/bin/xtrans2dng-gui", "755"],
    ["target/release/xtrans2dng", "usr/lib/mimizan-lab-xtrans/xtrans2dng", "755"],
    ["target/release/xtrans2dng-gui", "usr/lib/mimizan-lab-xtrans/xtrans2dng-gui", "755"],
    ["dist/mimizan-lab-xtrans.desktop", "usr/share/applications/", "644"],
    ["gui/assets/icon-16.png", "usr/share/icons/hicolor/16x16/apps/mimizan-lab-xtrans.png", "644"],
    ["gui/assets/icon-32.png", "usr/share/icons/hicolor/32x32/apps/mimizan-lab-xtrans.png", "644"],
    ["gui/assets/icon-48.png", "usr/share/icons/hicolor/48x48/apps/mimizan-lab-xtrans.png", "644"],
    ["gui/assets/icon-64.png", "usr/share/icons/hicolor/64x64/apps/mimizan-lab-xtrans.png", "644"],
    ["gui/assets/icon-128.png", "usr/share/icons/hicolor/128x128/apps/mimizan-lab-xtrans.png", "644"],
    ["gui/assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/mimizan-lab-xtrans.png", "644"],
    ["README.md", "usr/share/doc/mimizan-lab-xtrans/", "644"],
    ["dist/third-party/*", "usr/share/doc/mimizan-lab-xtrans/third-party/", "644"],
]
extended-description = """\
xtrans2dng turns a Fuji X-Trans RAF into a linear DNG without interpolating
the mosaic: luminance and the two chrominances are separated by the
frequencies the X-Trans tile carries them on, under the prior the mosaic
itself makes most probable. The DNG holds red, green and blue for every
pixel in the camera's own colours, not balanced and without a tone curve;
a raw developer opens it like the RAF. xtrans2dng-gui is the same in a
window: a list of RAFs, converted one after the other."""

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = 1

# The package: no debug info, stripped, fat LTO.
[profile.dist]
inherits = "release"
debug = false
strip = true
lto = "fat"
codegen-units = 1
