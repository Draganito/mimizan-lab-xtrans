[package]
name = "mimizan-lab-xtrans-gui"
description = "xtrans2dng in a window: a list of Fuji X-Trans RAFs, converted to linear DNGs one after the other"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "xtrans2dng-gui"
path = "src/main.rs"

[dependencies]
mimizan-lab-xtrans = { path = ".." }
rawler = "0.8"
rayon = "1.12"
egui = "0.36"
egui-file-dialog = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
# Free memory before a file is begun: a picture takes several GB.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# Linux lowers the thread with niceness, Windows with a thread priority.
# macOS has neither for one thread: gui/darwin sets the utility class.
[target.'cfg(not(target_os = "macos"))'.dependencies]
thread-priority = "3.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
mimizan-lab-xtrans-darwin = { path = "darwin" }

# GNOME Wayland draws no server-side frame: winit draws the Adwaita-style
# client-side decorations itself.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

# Windows draws with DirectX 12, which comes with the system: a virtual
# machine or a remote desktop has no OpenGL driver. With a graphics card
# DirectX 12 uses it; without one Windows draws on the CPU.
[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }

# macOS and the rest: the system's OpenGL.
[target.'cfg(not(any(target_os = "linux", target_os = "windows")))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }

# The icon of xtrans2dng-gui.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
